<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - DanzClean</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="topbar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>

<div class="sidebar" id="sidebar"></div>
<script src="sidebar.js"></script>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="container dl-page">
        <div class="dl-panel">
            <h2 class="dl-title">YouTube Downloader</h2>
            <p class="dl-lead">Tempel link YouTube, lalu tekan Cari Media.</p>
            
            <input type="url" id="ytUrlInput" class="dl-input" placeholder="Masukkan Link YouTube..." inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Masukkan Link YouTube...">
            
            <button onclick="processYoutubeSearch()" class="dl-cta"><svg class="btn-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Cari Media</span></button>
            
            <div id="ytResult" class="dl-result" aria-live="polite"></div>
        </div>
    </div>

    <div class="custom-popup" id="customPopup">
        <div class="custom-popup-card">
            <div class="custom-popup-text" id="customPopupText"></div>
            <button class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
        </div>
    </div>

    <script>
        let currentYtUrl = "";

        function showCustomPopup(message) {
            document.getElementById("customPopupText").innerText = message;
            document.getElementById("customPopup").classList.add("show");
        }

        function closeCustomPopup() {
            document.getElementById("customPopup").classList.remove("show");
        }

        function toggleMenu(){
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function extractFilename(url) {
            try {
                return new URL(url).searchParams.get('n') || 'danzclean_file';
            } catch {
                return 'danzclean_file';
            }
        }

        // Trigger download native browser (server sudah kirim Content-Disposition: attachment,
        // jadi browser langsung streaming ke disk tanpa nunggu file utuh ke-load ke memori dulu)
        function forceDownload(fileUrl, fileName, btnElement) {
            if (!fileName) fileName = extractFilename(fileUrl);
            const originalText = btnElement.innerText;
            btnElement.innerText = "Membuka unduhan...";
            btnElement.style.opacity = "0.7";

            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = fileUrl;
            a.download = fileName;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.opacity = "1";
            }, 1200);
        }

        function formatDuration(seconds) {
            if (!seconds) return '';
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function isValidYoutubeUrl(url) {
            return /youtube\.com|youtu\.be/i.test(url);
        }

        async function processYoutubeSearch() {
            const url = document.getElementById("ytUrlInput").value.trim();
            const resultDiv = document.getElementById("ytResult");

            if (!url) {
                alert("Masukkan URL YouTube terlebih dahulu!");
                return;
            }

            if (!isValidYoutubeUrl(url)) {
                showCustomPopup("Itu bukan link YouTube!");
                return;
            }

            currentYtUrl = url;
            resultDiv.innerHTML = '<p class="dl-msg">Mengambil data video...</p>';

            try {
                const targetApi = `${YT_API}/ytmp4?url=${encodeURIComponent(url)}`;
                const response = await fetch(targetApi);
                const data = await response.json();

                if (!data.status || !data.result) {
                    resultDiv.innerHTML = `<p class="dl-msg dl-err">Gagal mengambil data dari URL tersebut.<br><span class="dl-msg-detail">${data.error || data.message || ''}</span></p>`;
                    return;
                }

                const res = data.result;

                resultDiv.innerHTML = `
                    <div class="dl-card">
                        ${res.thumbnail ? `<img src="${res.thumbnail}" class="dl-media">` : ''}
                        <p class="dl-caption">${res.title || 'YouTube Video'}</p>
                        <p class="dl-meta">${res.duration ? formatDuration(res.duration) : ''}</p>
                        <div class="dl-actions dl-actions-row">
                            <button id="ytMp4Btn" onclick="downloadYoutube('mp4', this)" class="dl-btn">DOWNLOAD MP4</button>
                            <button id="ytMp3Btn" onclick="downloadYoutube('mp3', this)" class="dl-btn dl-btn-alt">DOWNLOAD MP3</button>
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error(e);
                resultDiv.innerHTML = `<p class="dl-msg dl-err">Terjadi kesalahan koneksi.<br><span class="dl-msg-detail">${e.message}</span></p>`;
            }
        }

        async function downloadYoutube(format, btnElement) {
            if (!currentYtUrl) return;

            const originalText = btnElement.innerText;
            btnElement.innerText = "Memproses...";
            btnElement.disabled = true;

            try {
                const endpoint = format === 'mp3' ? 'ytmp3' : 'ytmp4';
                const targetApi = `${YT_API}/${endpoint}?url=${encodeURIComponent(currentYtUrl)}`;
                const response = await fetch(targetApi);
                const data = await response.json();

                if (!data.status || !data.result || !data.result.download) {
                    alert("Gagal mengambil link download.");
                    btnElement.innerText = originalText;
                    btnElement.disabled = false;
                    return;
                }

                btnElement.disabled = false;
                btnElement.innerText = originalText;
                forceDownload(data.result.download, originalText, btnElement);
            } catch (e) {
                console.error(e);
                alert("Terjadi kesalahan koneksi.");
                btnElement.innerText = originalText;
                btnElement.disabled = false;
            }
        }
    </script>
</body>
</html>
