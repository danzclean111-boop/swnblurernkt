<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Downloader - DanzClean</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="topbar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>

    <div class="sidebar" id="sidebar"></div>
    <script src="sidebar.js"></script>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="container dl-page">
        <div class="dl-panel">
            <h2 class="dl-title">Pinterest Downloader</h2>
            <p class="dl-lead">Tempel link Pinterest, lalu tekan Cari Media.</p>

            <input type="url" id="pinUrlInput" class="dl-input" placeholder="Masukkan Link Pinterest..." inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Masukkan Link Pinterest...">

            <button onclick="processPinterestSearch()" class="dl-cta"><svg class="btn-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Cari Media</span></button>

            <div id="pinResult" class="dl-result" aria-live="polite"></div>
        </div>
    </div>

    <div class="custom-popup" id="customPopup">
        <div class="custom-popup-card">
            <div class="custom-popup-text" id="customPopupText"></div>
            <button class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
        </div>
    </div>

    <script>
        let currentPinResult = null;

        function showCustomPopup(message) {
            document.getElementById("customPopupText").innerText = message;
            document.getElementById("customPopup").classList.add("show");
        }

        function closeCustomPopup() {
            document.getElementById("customPopup").classList.remove("show");
        }

        function toggleMenu(){
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function isValidPinterestUrl(url) {
            return /pinterest\.com|pin\.it/i.test(url);
        }

        function getBestImage(images) {
            if (!images || !images.length) return null;
            const orig = images.find(img => img.name === "orig");
            if (orig) return orig;

            let best = images[0];
            let bestArea = (best.width || 0) * (best.height || 0);
            images.forEach(img => {
                const area = (img.width || 0) * (img.height || 0);
                if (area > bestArea) {
                    best = img;
                    bestArea = area;
                }
            });
            return best;
        }

        async function processPinterestSearch() {
            const url = document.getElementById("pinUrlInput").value.trim();
            const resultDiv = document.getElementById("pinResult");

            if (!url) {
                alert("Masukkan URL Pinterest terlebih dahulu!");
                return;
            }

            if (!isValidPinterestUrl(url)) {
                showCustomPopup("Itu bukan link Pinterest!");
                return;
            }

            currentPinResult = null;
            resultDiv.innerHTML = '<p class="dl-msg">Mengambil data Pinterest...</p>';

            try {
                const targetApi = `${YT_API}/pinterest?url=${encodeURIComponent(url)}`;
                const response = await fetch(targetApi);
                const data = await response.json();

                if (!data.status || !data.result) {
                    resultDiv.innerHTML = `<p class="dl-msg dl-err">Gagal mengambil data dari URL tersebut.<br><span class="dl-msg-detail">${data.error || data.message || ''}</span></p>`;
                    return;
                }

                const res = data.result;
                currentPinResult = res;

                const isVideo = res.type === "video";
                const videoUrl = isVideo ? (res.download || (res.videos && res.videos[0] && res.videos[0].url)) : null;
                const photoUrl = !isVideo ? (getBestImage(res.images) || {}).url : null;
                const captionText = res.title || (isVideo ? 'Video Pinterest' : 'Gambar Pinterest');

                let mediaHtml = '';
                if (isVideo && videoUrl) {
                    mediaHtml = `
                        <video controls class="dl-media">
                            <source src="${videoUrl}" type="video/mp4">
                        </video>`;
                } else if (photoUrl) {
                    mediaHtml = `<img src="${photoUrl}" class="dl-media">`;
                }

                let tutorialHtml = '';
                if (isVideo) {
                    tutorialHtml = `
                        <div class="dl-tip">
                            <p class="dl-tip-title">
                                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg> Cara Menyimpan Video
                            </p>
                            
                            <div class="dl-tip-step">
                                <span class="dl-badge">TUTORIAL 1</span>
                                <p class="dl-tip-text">
                                    Klik ikon <strong>titik tiga (⋮)</strong> di pojok kanan bawah video di atas, lalu pilih <strong>"Download"</strong>.
                                </p>
                            </div>

                            <div class="dl-tip-step dl-tip-sep">
                                <span class="dl-badge">TUTORIAL 2</span>
                                <p class="dl-tip-text">
                                    <strong>Tekan & tahan lama</strong> pada area video di atas, lalu pilih <strong>"Simpan Video" / "Download Video"</strong>.
                                </p>
                            </div>
                        </div>
                    `;
                } else {
                    tutorialHtml = `
                        <div class="dl-tip dl-tip-c">
                            <p class="dl-user">
                                 Cara Menyimpan Foto
                            </p>
                            <p class="dl-tip-text">
                                <strong>Tekan & tahan lama</strong> gambar di atas, lalu pilih <strong>"Download Gambar"</strong>.
                            </p>
                        </div>
                    `;
                }

                resultDiv.innerHTML = `
                    <div class="dl-card">
                        <h3 class="dl-caption dl-caption-h">${captionText}</h3>
                        <p class="dl-meta">${res.user && res.user.fullName ? 'By: ' + res.user.fullName : ''}</p>
                        
                        ${mediaHtml}
                        ${tutorialHtml}
                    </div>
                `;
            } catch (e) {
                console.error(e);
                resultDiv.innerHTML = `<p class="dl-msg dl-err">Terjadi kesalahan koneksi.<br><span class="dl-msg-detail">${e.message}</span></p>`;
            }
        }
    </script>
</body>
</html>
